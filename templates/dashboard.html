{% extends "base.html" %}

{% block title %}Дашборд - BusinessAI{% endblock %}

{% block content %}
<div class="space-y-6 pb-20 pt-safe">
    <!-- Header & Business Select -->
    <div class="flex flex-col space-y-4 animate-fade-in">
        <h1 class="text-2xl font-bold text-white drop-shadow-md text-center">Дашборд</h1>
        
        <div class="relative">
            <select id="businessSelect" class="w-full appearance-none glass-card no-transform text-white py-3 px-4 pr-8 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all cursor-pointer">
                <option>Загрузка...</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
            </div>
        </div>
    </div>

    <!-- KPI Carousel -->
    <div class="flex overflow-x-auto snap-x snap-mandatory gap-4 pb-4 no-scrollbar animate-fade-in" id="kpiCarousel">
        <!-- Revenue -->
        <div class="glass-card p-6 rounded-3xl min-w-[85%] snap-center flex flex-col justify-center relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-20">
                <span class="text-6xl">💰</span>
            </div>
            <div class="text-slate-300 text-sm font-medium mb-2 uppercase tracking-wider">Выручка</div>
            <div class="text-4xl font-bold text-white mb-2" id="revenue-value"><span class="animate-pulse">...</span></div>
            <div class="text-sm font-medium text-green-400 bg-green-500/10 self-start px-3 py-1 rounded-full" id="revenue-change">--</div>
        </div>
        
        <!-- Profit -->
        <div class="glass-card p-6 rounded-3xl min-w-[85%] snap-center flex flex-col justify-center relative overflow-hidden bg-gradient-to-br from-blue-900/40 to-purple-900/40 border-primary/30">
            <div class="absolute top-0 right-0 p-4 opacity-20">
                <span class="text-6xl">🚀</span>
            </div>
            <div class="text-slate-300 text-sm font-medium mb-2 uppercase tracking-wider">Чистая прибыль</div>
            <div class="text-4xl font-bold text-white mb-2" id="profit-value"><span class="animate-pulse">...</span></div>
            <div class="text-sm font-medium text-green-400 bg-green-500/10 self-start px-3 py-1 rounded-full" id="profit-change">--</div>
        </div>

        <!-- Expenses -->
        <div class="glass-card p-6 rounded-3xl min-w-[85%] snap-center flex flex-col justify-center relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-20">
                <span class="text-6xl">💸</span>
            </div>
            <div class="text-slate-300 text-sm font-medium mb-2 uppercase tracking-wider">Расходы</div>
            <div class="text-4xl font-bold text-white mb-2" id="expenses-value"><span class="animate-pulse">...</span></div>
            <div class="text-sm font-medium text-red-400 bg-red-500/10 self-start px-3 py-1 rounded-full" id="expenses-change">--</div>
        </div>

        <!-- Clients -->
        <div class="glass-card p-6 rounded-3xl min-w-[85%] snap-center flex flex-col justify-center relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-20">
                <span class="text-6xl">👥</span>
            </div>
            <div class="text-slate-300 text-sm font-medium mb-2 uppercase tracking-wider">Клиенты</div>
            <div class="text-4xl font-bold text-white mb-2" id="clients-value"><span class="animate-pulse">...</span></div>
            <div class="text-sm font-medium text-blue-400 bg-blue-500/10 self-start px-3 py-1 rounded-full" id="clients-change">--</div>
        </div>
    </div>

    <!-- Charts Section -->
    <div class="space-y-4 animate-fade-in delay-200">
        <div class="glass-card rounded-2xl p-4">
            <!-- Filter Chips -->
            <div class="flex overflow-x-auto gap-2 pb-4 mb-2 no-scrollbar" id="chartFilters">
                <button class="filter-chip active" data-filter="all">Основные</button>
                <button class="filter-chip" data-filter="finance">Финансы</button>
                <button class="filter-chip" data-filter="unit">Юнит-экономика</button>
                <button class="filter-chip" data-filter="growth">Рост</button>
                <button class="filter-chip" data-filter="health">Здоровье</button>
            </div>

            <h3 class="text-sm font-bold text-slate-200 mb-4" id="chartTitle">Динамика показателей</h3>
            
            <!-- Chart Containers (We might toggle these or just update data) -->
            <div class="h-64 relative">
                <canvas id="mainChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Metrics Accordion -->
    <div class="space-y-4 animate-fade-in delay-300 pb-20" id="metricsAccordion">
        <!-- Populated by JS -->
    </div>
</div>
{% endblock %}
