<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Бизнес Аналитик{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0B0E14',
                            card: '#151a23',
                            text: '#f8fafc',
                            muted: '#94a3b8'
                        },
                        primary: '#00E5FF',
                        accent: '#00FF94'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: max(20px, env(safe-area-inset-top)); }
        .mb-safe { margin-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="min-h-screen pt-safe select-none bg-dark-bg text-dark-text overflow-y-auto">
    
    <!-- Background Particles -->
    <ul class="particles">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <!-- Access Denied Overlay -->
    <div id="access-denied" class="fixed inset-0 z-50 bg-dark-bg flex flex-col items-center justify-center p-6 text-center hidden">
        <div class="text-6xl mb-4">⛔</div>
        <h1 class="text-2xl font-bold mb-2">Доступ запрещен</h1>
        <p class="text-slate-400 mb-6">Пожалуйста, откройте это приложение через Telegram бота.</p>
        <a href="https://t.me/BusinessLavr_bot" class="bg-primary hover:bg-cyan-400 text-black font-bold py-3 px-6 rounded-lg transition-colors shadow-[0_0_15px_rgba(0,229,255,0.4)]">
            Перейти в бота
        </a>
    </div>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-4 max-w-md" id="main-app">
        {% block content %}{% endblock %}
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-4 left-4 right-4 z-50 mb-safe">
        <div class="glass-card rounded-2xl flex justify-around items-center h-16 max-w-md mx-auto px-2 shadow-lg shadow-primary/10 border border-white/10">
            <a href="/" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-primary transition-colors">
                <span class="text-2xl mb-1">🏠</span>
                <span class="text-xs font-medium">Главная</span>
            </a>
            <a href="/dashboard" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-primary transition-colors">
                <span class="text-2xl mb-1">📊</span>
                <span class="text-xs font-medium">Дашборд</span>
            </a>
            <a href="/analytics" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-primary transition-colors">
                <span class="text-2xl mb-1">📈</span>
                <span class="text-xs font-medium">Аналитика</span>
            </a>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
